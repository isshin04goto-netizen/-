<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>商品分析ノート</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>商品分析ノート</h1>
    <p class="sub">TikTok Shop アフィリエイト向け</p>
  </header>

  <main>
    <section class="toolbar">
      <button id="btn-add" class="primary">＋ 商品を追加</button>
      <select id="sort" aria-label="並び替え">
        <option value="total">総合スコア順</option>
        <option value="commission">報酬単価順</option>
        <option value="income">想定月収順</option>
        <option value="demand">需要順</option>
        <option value="created">追加順</option>
      </select>
      <input id="filter" type="search" placeholder="商品名・カテゴリで検索">
    </section>

    <section id="summary" class="summary"></section>
    <ul id="list" class="list"></ul>

    <div id="empty" class="empty" hidden>
      <p>まだ商品がありません。</p>
      <p>「＋ 商品を追加」か、下のメニューからCSV取り込み・サンプル読み込みができます。</p>
    </div>

    <details class="more">
      <summary>データ・設定</summary>
      <div class="more-body">
        <div class="row">
          <label class="btn">CSVを取り込む<input id="csv-in" type="file" accept=".csv,text/csv" hidden></label>
          <button id="btn-export">CSVで書き出す</button>
          <button id="btn-sample">サンプルを読み込む</button>
          <button id="btn-clear" class="danger">全削除</button>
        </div>
        <p class="hint">CSVの見出し: 商品名, カテゴリ, 価格, 手数料率, 月間販売数, 評価, レビュー数, 紹介クリエイター数, 動画映え, URL, メモ</p>

        <h3>スコアの重み</h3>
        <p class="hint">重視したい項目ほど大きくしてください。</p>
        <div id="weights" class="weights"></div>
        <button id="btn-reset-w">重みを初期値に戻す</button>
      </div>
    </details>
  </main>

  <dialog id="dlg-form">
    <form id="form" method="dialog">
      <h2 id="form-title">商品を追加</h2>
      <label>商品名 *<input name="name" required></label>
      <label>カテゴリ<input name="category" list="cats" placeholder="美容、キッチン、ガジェット…"></label>
      <datalist id="cats"></datalist>
      <div class="grid2">
        <label>価格（円）<input name="price" type="number" inputmode="decimal" min="0" step="1"></label>
        <label>手数料率（%）<input name="commissionRate" type="number" inputmode="decimal" min="0" max="100" step="0.1"></label>
        <label>月間販売数<input name="monthlySales" type="number" inputmode="numeric" min="0"></label>
        <label>紹介クリエイター数<input name="creators" type="number" inputmode="numeric" min="0"></label>
        <label>評価（★0〜5）<input name="rating" type="number" inputmode="decimal" min="0" max="5" step="0.1"></label>
        <label>レビュー数<input name="reviews" type="number" inputmode="numeric" min="0"></label>
      </div>
      <label>動画映え <output id="visual-out">3</output> / 5
        <input name="visual" type="range" min="1" max="5" step="1" value="3">
        <span class="hint">使用前後の変化、驚き、実演のしやすさで自己評価</span>
      </label>
      <label>商品URL<input name="url" type="url" placeholder="https://"></label>
      <label>メモ<textarea name="memo" rows="3" placeholder="訴求ポイント、気になる点など"></textarea></label>
      <div id="preview" class="preview"></div>
      <div class="actions">
        <button type="button" id="btn-cancel">キャンセル</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-detail">
    <div id="detail"></div>
    <div class="actions">
      <button id="btn-del" class="danger">削除</button>
      <button id="btn-edit">編集</button>
      <button id="btn-close" class="primary">閉じる</button>
    </div>
  </dialog>

  <script src="score.js"></script>
  <script src="app.js"></script>
</body>
</html>
